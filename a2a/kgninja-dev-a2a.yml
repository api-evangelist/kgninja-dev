agent_card:
  name: Agent Verification Utility
  description: >-
    A stateless synchronous A2A adapter that validates a prechecked paid intent, creates or reuses a quote
    bound to its receipt digest and spend policy, and returns exact x402 and MCP purchase instructions as a
    direct Message. It does not create Tasks or execute paid work without payment.
  url: https://agent-economy.kgninja.dev/a2a
  version: 0.4.3
  protocol_version: '1.0'
  protocol_binding: JSONRPC
  supported_interfaces:
  - {url: https://agent-economy.kgninja.dev/a2a, protocolBinding: JSONRPC, protocolVersion: '1.0'}
  provider:
    organization: KG-NINJA
    url: https://agent-economy.kgninja.dev
  documentation_url: https://agent-economy.kgninja.dev/docs/mcp-x402-interoperability
  icon_url: https://agent-economy.kgninja.dev/icon.svg
  capabilities:
    streaming: false
    push_notifications: false
    extended_agent_card: false
  default_input_modes: [application/json]
  default_output_modes: [application/json]
  security_schemes: null
  security_requirements: []
  skill_count: 1
  skills:
  - id: prepare-json-evidence-verification
    name: Prepare JSON evidence verification
    tags: [json, verification, x402, quote]
    input_modes: [application/json]
    output_modes: [application/json]
    example: 'Quote a deterministic check that /status equals ready in supplied JSON.'
  skill_invocation: >-
    SendMessage with one application/json DataPart carrying {idempotency_key, intent}, where intent is the
    unchanged request + spend_policy from a successful free precheck plus its precheck_receipt_digest. The
    returned Message carries a bound quote and the exact HTTP / MCP purchase instructions; paid execution is
    a separate, explicit step through POST /verify-evidence or the MCP tool verify_evidence.
conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '1.0'
  protocol_binding: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: not-applicable-in-1.0 (protocolBinding is carried per interface in supportedInterfaces[])
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass) with streaming,
    pushNotifications and extendedAgentCard. protocolVersion is present (pass) — carried where 1.0.0 places
    it, on the interface entry in supportedInterfaces[] ("1.0"), rather than as the 0.3-era top-level field;
    the live endpoint confirms the version by answering with an a2a-version: 1.0 header and by rejecting an
    unversioned (0.3) request with VERSION_NOT_SUPPORTED. skills is an ARRAY (pass) of one fully populated
    skill with id, name, description, tags, examples, inputModes, outputModes and securityRequirements.
    defaultInputModes and defaultOutputModes are present. This is a 1.0.0-shaped card — supportedInterfaces[]
    with protocolBinding, securityRequirements (the 1.0 name), capabilities.extendedAgentCard — and it is
    internally consistent with that revision; the endpoint's 1.0 method names (GetTask, ListTasks) and error
    codes (-32001, -32009) were verified live.
  deviations:
  - field: url / preferredTransport / protocolVersion (top-level)
    observed: absent; replaced by supportedInterfaces[] with protocolBinding and per-interface protocolVersion
    note: >-
      Correct for A2A 1.0.0, which the card and the endpoint both declare. A reader written against A2A
      0.3.0 looks for the top-level triple and will not find it. Recorded because both card shapes coexist
      in the catalog, not as a fault.
  - field: securitySchemes / securityRequirements
    observed: securitySchemes absent; securityRequirements is an empty array at the card level and on the skill
    note: >-
      The card declares no authentication scheme, which is accurate: auth.md states the service is
      intentionally anonymous and that OAuth metadata is deliberately not published. The gate on the paid
      step is x402 payment, which the card does not declare as an extension (no capabilities.extensions[];
      no a2a-x402 URI) — an agent learns the payment model from the skill description and from
      documentationUrl, not from the card's security or extension fields.
  - field: skills
    observed: exactly one skill, and it is a quote-preparation skill, not the paid verification itself
    note: >-
      By design (the description says so): the A2A surface prepares a purchase and hands the agent to HTTP
      or MCP for paid execution. It is the narrowest of the three surfaces on this host.
  - field: signatures
    observed: absent
    note: No JWS signature block; the card's authenticity rests on TLS to agent-economy.kgninja.dev. (The provider does publish a JWKS, but for signing verification evidence, not the card.)
surface_relationship:
  note: >-
    KG-NINJA publishes three agent surfaces on one host and they are projections of one product. A2A: one
    skill at /a2a that prepares a bound quote. MCP: five tools at /mcp (four free, one paid) — see
    mcp/kgninja-dev-mcp.yml. REST: 44 operations, of which POST /validate-request, POST /quote and POST
    /verify-evidence are the flow every agent surface ultimately maps to — see
    mcp/kgninja-dev-tool-crosswalk.yml.
