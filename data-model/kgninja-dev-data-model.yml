docs: https://agent-economy.kgninja.dev/docs/reproducible-x402-receipts
description: >-
  Entity graph derived from the 47 component schemas in the provider's OpenAPI 3.1.0 ($ref links and the
  prefixed identifier fields) plus the receipts guide. The product has one transaction shape: a bounded
  verification REQUEST, wrapped with a SPEND POLICY into an INTENT, prechecked into an unsigned RECEIPT
  whose digest binds a QUOTE, paid through an x402 PAYMENT REQUIREMENT, executed into a RESULT with
  SIGNED EVIDENCE, and delivered with a DELIVERY RECEIPT and FULFILLMENT PROOF. Everything is addressed by
  a prefixed id or a sha256: digest; nothing is retrievable after delivery (no GET by id exists for any
  transaction entity), so the "relationships" are relationships inside one response, not across a
  queryable store.
identifier_prefixes:
  req_: request_id (server-issued per request; also the X-Request-ID header)
  qte_: quote_id (QuoteResponse; bound to a PaidVerificationBinding)
  pqt_: quote_id on the MachineQuote returned inside a free precheck
  txn_: transaction_id (VerifyEvidenceResponse)
  evd_: evidence_id (SignedEvidence)
  rcpt_: receipt_id (DeliveryReceipt / VerificationReceiptPayload)
  'sha256:': Sha256Digest — request_hash, evidence_digest, receipt_digest, binding_digest, precheck_receipt_digest, schema_digest, checks_digest
  'urn:kgninja:params:agent-credential:anonymous-registration-receipt': credential type of the optional registration receipt
domains:
  request: [VerifyEvidenceRequest, InlineJsonEvidence, Assertion, Sha256EqualsAssertion, JsonPointerExistsAssertion, JsonPointerEqualsAssertion, JsonTypeIsAssertion, JsonPointer, VerificationSpendPolicy, VerificationPrecheckIntent, PaidVerificationIntent]
  decision_support: [VerificationRecipes, PrecheckReceipt, CanonicalOffer, CanonicalSchemaReference, MachineQuote, FreeRequestValidation, FreeRequestValidationFailure]
  purchase: [QuoteResponse, Price, PaidVerificationBinding, QuotedPaidVerificationBinding, PaymentRequiredPaidVerificationBinding, DeliveredPaidVerificationBinding, RefusedPaidVerificationBinding, X402PaymentRequired, X402PaymentRequirement]
  delivery: [VerifyEvidenceResponse, VerificationResult, SignedEvidence, DeliveryReceipt, FulfillmentProof, SignedVerificationReceipt, VerificationReceiptPayload]
  operations: [HealthResponse, PublicStats, RevenueGoalStatus]
  discovery: [Jwks, AgentManifest, VerificationKey, X402Manifest]
  common: [Sha256Digest, ErrorResponse]
