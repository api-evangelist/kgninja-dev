lifecycle_of_a_purchase:
- 'VerificationPrecheckIntent -> POST /validate-request -> FreeRequestValidation (PrecheckReceipt.receipt_digest)'
- 'PaidVerificationIntent (carrying that digest) -> POST /quote -> QuoteResponse (qte_, binding state quoted, expires_at)'
- 'PaidVerificationIntent -> POST /verify-evidence -> 402 X402PaymentRequired (binding state payment_required) -> paid retry -> VerifyEvidenceResponse (txn_, binding state delivered) or ErrorResponse (binding state refused)'
- 'SignedEvidence.signature.kid -> Jwks key -> offline Ed25519 verification of signed_payload_b64url'
retrieval:
  by_id: none — no GET exists for a quote, transaction, evidence or receipt; the delivery response is the only copy (recourse.receipt_retrieval and evidence_retrieval are null in the schema)
  note: 'The provider states raw evidence is not retained; only digests and transaction metadata are stored in D1.'
