summary: >-
  There is no separate test environment, no test-mode key and no simulated payment: production is the
  only host, and the x402 manifest states simulation false and mockMode false. What KG-NINJA publishes
  instead is a rehearsal surface that is mandatory rather than optional — a free precheck whose receipt
  digest the paid call must carry, a free quote, four free MCP tools — plus provider-authored fixtures: three
  verification recipes each carrying a literally-submittable precheck_intent_example, the SKILL.md worked
  example, and the x402 manifest's bazaar example_usage. A testnet chain id (Base Sepolia, eip155:84532) is
  enumerated in the contract's network enums, but no page says that testnet payments are accepted.
test_vs_live:
  separate_environment: false
  key_prefixes: not applicable — no keys are issued
  simulation: false
  mock_mode: false
  source: 'well-known/kgninja-dev-x402.json: "simulation": false, "simulation_notice": null; accepts[].extra.mockMode false'
  testnet:
    declared: eip155:84532 (Base Sepolia) in Price.network, VerificationSpendPolicy.network, X402PaymentRequirement.network and the MCP tool inputSchemas
    served: eip155:8453 only (x402 manifest accepts[], canonical offer, agent.json payment)
    note: 'Declared in schema, not offered on any served terms; whether the facilitator would settle an eip155:84532 payment is not stated anywhere found. Recorded as declared and unverified — not as a sandbox.'
dry_run:
  operation: validateVerificationRequest
  route: POST /validate-request
  cost: free — no key and no payment
  behaviour: >-
    "This endpoint performs no external fetch, creates no quote, transaction, or payment, executes no
    assertion, returns no signed evidence, and retains or logs no raw evidence." It validates the request
    and the spend policy and returns an unsigned PrecheckReceipt (schema agent-economy/precheck-receipt/2.0)
    whose receipt_digest must be copied into the paid intent; the paid route recomputes it.
  guarantee: 'SKILL.md: "A successful precheck creates no quote or transaction, calls no Verification Core, executes no assertion, and returns no signed evidence."'
  mandatory: true — verifyEvidence answers 409 PRECHECK_REQUIRED without it
  also_free: [quoteVerifyEvidence (POST /quote), mcp:describe_verify_evidence, mcp:quote_verify_evidence, mcp:prepare_verify_evidence_purchase, a2a:prepare-json-evidence-verification]
