aid: kgninja-dev
name: KG-NINJA
description: >-
  KG-NINJA is the operator identity (GitHub user KG-NINJA, Osaka; Cloudflare Wallet handle @kgninja) behind
  Agent Verification Utility at agent-economy.kgninja.dev, a Cloudflare Workers service (v0.4.3) that runs
  bounded deterministic checks (SHA-256 equality, JSON Pointer existence/equality/type) over caller-supplied
  inline JSON and returns an Ed25519-signed execution record, sold to agents per call
  for 10000 atomic USDC ($0.01) on Base through x402 v2 with no account, API key or OAuth. One origin
  exposes the product three ways — a 44-operation OpenAPI 3.1.0 contract at /openapi.json, a remote
  Streamable HTTP MCP server at /mcp answering an anonymous tools/list (five tools, one paid), and an A2A 1.0
  agent card at /.well-known/agent-card.json with JSON-RPC at /a2a — plus an RFC 9727 API catalog, an MCP
  Registry server.json, a provider-published Agent Skill, a JWKS, an x402 manifest, llms.txt and
  Content-Signal. The apex kgninja.dev has no A record; the subdomain is its only web presence.
