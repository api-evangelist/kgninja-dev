apis:
- aid: kgninja-dev:agent-verification-utility-mcp-server
  name: Agent Verification Utility MCP Server
  image: https://agent-economy.kgninja.dev/icon.svg
  description: >-
    Remote Model Context Protocol server at https://agent-economy.kgninja.dev/mcp — stateless Streamable
    HTTP, POST only (GET returns 405), serverInfo dev.kgninja/agent-verification-utility 0.4.3, protocol
    version 2025-06-18 negotiated live and 2026-07-28 declared on the server card. initialize and tools/list
    answer anonymously with five tools carrying real inputSchemas and MCP annotations: four free (describe_verify_evidence,
    get_revenue_goal_status, quote_verify_evidence, prepare_verify_evidence_purchase) and one paid (verify_evidence),
    whose unpaid call returns an x402 v2 PaymentRequired document in _meta["x402/error"] and is retried
    with _meta["x402/payment"]. resources/list and prompts/list are not implemented. Published alongside
    it: an MCP Registry server.json, an experimental MCP Server Card, a Cloudflare Agent Readiness card
    at /.well-known/mcp/server-card.json (aliased at /.well-known/mcp.json), a registry HTTP ownership
    proof and a browser WebMCP bridge (webmcp.js).
  humanURL: https://agent-economy.kgninja.dev/docs/mcp-x402-interoperability
  baseURL: https://agent-economy.kgninja.dev/mcp
