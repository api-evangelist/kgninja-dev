    paid tool; every response exposes PAYMENT-REQUIRED and PAYMENT-RESPONSE via CORS.
  note: >-
    The x402 manifest and the contract were fetched and read; a live 402 was NOT observed, because
    /verify-evidence refuses an empty body with 409 PRECHECK_REQUIRED before creating a quote, and reaching
