- id: x402
  name: x402 HTTP payment protocol
  version: 2 (scheme exact)
  conforms: true
  verification: partial
  domain_standard_signature: true
  evidence: >-
    well-known/kgninja-dev-x402.json (x402Version 2, two resources — POST /verify-evidence and POST /mcp —
    each accepting {scheme exact, network eip155:8453, amount 10000, asset 0x8335…2913, payTo 0x4D7d…aDE3,
    maxTimeoutSeconds 300} with a bazaar extension; simulation false); openapi/kgninja-dev-openapi.json
    verifyEvidence declares 402 with a PAYMENT-REQUIRED header and the X402PaymentRequired schema
