summary: >-
  KG-NINJA's conformance profile is the agent-discovery and agent-commerce protocol stack, implemented
  unusually completely on one host: an A2A 1.0 agent card and JSON-RPC responder, an MCP server at
  2025-06-18/2026-07-28 with server card, registry document and ownership proof, an RFC 9727 API catalog
  served with the linkset media type, x402 v2 (exact scheme, USDC on Base) with a self-hosted manifest and
  Bazaar extension, an Agent Skills discovery index with SHA-256 integrity, an RFC 7517 JWKS publishing an
  Ed25519 (RFC 8032 / RFC 8037 EdDSA) evidence key, RFC 6901 JSON Pointers as the assertion addressing
  scheme, CAIP-2 chain identifiers, IETF Content Signals, and schema.org JSON-LD on the landing page. It
  deliberately declines OAuth 2.0 / OIDC / RFC 9728 ("this is not an OAuth-protected resource"), does not
  use RFC 9457 problem details, and publishes neither security.txt nor RFC 8594 sunset signalling. No
  certifications or compliance program are published, so no Compliance pointer is emitted.
