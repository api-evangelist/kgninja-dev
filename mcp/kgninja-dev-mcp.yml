summary: >-
  KG-NINJA operates ONE remote MCP server at https://agent-economy.kgninja.dev/mcp — the same origin as its
  website, OpenAPI and A2A endpoint. It is stateless Streamable HTTP, POST only (GET returns 405 with
  details.allowed "POST"), negotiated protocol version 2025-06-18 in a live initialize (the server card
  declares 2026-07-28, 2025-11-25, 2025-06-18 and 2025-03-26 as supported), identifies itself as serverInfo
  {name: dev.kgninja/agent-verification-utility, version: 0.4.3}, and answers initialize and tools/list
  anonymously with five tools that carry real JSON Schema 2020-12 inputSchemas AND MCP tool annotations
  (readOnlyHint, destructiveHint, idempotentHint, openWorldHint). resources/list and prompts/list return
  -32601 Method not found. Four tools are free; verify_evidence is paid: an unpaid call returns a tool error
  whose _meta["x402/error"] carries an x402 v2 PaymentRequired document plus a paid verification binding,
  and the identical call is retried with the encoded payment in _meta["x402/payment"]. Anonymous tools/list
  succeeded, so authorship is knowable: the tool names, the dev.kgninja namespace and the _meta extension
  keys (dev.kgninja/offer-generation, dev.kgninja/decision-support, dev.kgninja/x402) are specific to this
  provider and match no shared platform fingerprint — this is a provider-built server, not a
  Wix/Shopify/Mintlify/WordPress-plugin surface.
deployment:
  mode: remote
  endpoint: https://agent-economy.kgninja.dev/mcp
  auth: none
  verified: probed
  note: >-
    A hosted HTTPS endpoint an MCP client POSTs to directly; KG-NINJA ships no stdio package and documents no
    npx/uvx install. auth is "none" in the connection sense — the server card says authentication.required
    false, and initialize, tools/list and the four free tools need no credential; no OAuth metadata is
    served on this host, by the provider's stated design (auth.md). The paid tool is gated by x402 PAYMENT
    (USDC on Base, eip155:8453, 10000 atomic units per call), which is an economic gate on one invocation,
    not an authentication scheme on the server. The x402 manifest lists /mcp itself as a paid x402 resource.
servers:
- id: agent-verification-utility
  name: Agent Verification Utility
  endpoint: https://agent-economy.kgninja.dev/mcp
  transport: streamable-http
  http_methods: [POST]
  auth: none
  payment: x402 v2 "exact" scheme, USDC on Base (eip155:8453), 10000 atomic units ($0.01) per verify_evidence call; challenge in _meta["x402/error"], payment in _meta["x402/payment"], settlement proof in _meta["x402/payment-response"]
  status: live
  probe:
    fetched: '2026-09-19'
    initialize:
      http_status: 200
      content_type: text/event-stream
      requested_protocol_version: '2025-06-18'
      protocol_version: '2025-06-18'
      server_info: {name: dev.kgninja/agent-verification-utility, version: 0.4.3}
      capabilities: {tools: {listChanged: true}}
    tools_list:
      http_status: 200
      content_type: text/event-stream
      tool_count: 5
      file: mcp/kgninja-dev-mcp-tools.json
      annotations_present: true
    tools_call:
      tool: describe_verify_evidence
      http_status: 200
      note: >-
        The one free, read-only tool (readOnlyHint true, idempotentHint true) was called once with no
        arguments; it returned the product description, limits (65,536 evidence bytes, 16 assertions), the
        free/paid tool split, the canonical offer with its 0.01 USDC price and paid_execution_automatic
        false. No paid tool was called; nothing was purchased.
    resources_list: {http_status: 200, error: '-32601 Method not found'}
    prompts_list: {http_status: 200, error: '-32601 Method not found'}
    get_request: {http_status: 405, body: '{"error":{"code":"METHOD_NOT_ALLOWED","message":"The HTTP method is not supported for this resource.","request_id":"req_…","retryable":false,"details":{"allowed":"POST"}}}'}
    response_headers_observed: [access-control-allow-origin *, access-control-allow-headers incl. mcp-session-id and MCP-Protocol-Version, access-control-expose-headers incl. PAYMENT-REQUIRED and PAYMENT-RESPONSE, content-signal, link (service-desc/service-doc/api-catalog), strict-transport-security, x-request-id, x-service-version 0.4.3]
  authorship: provider
  authorship_basis: dev.kgninja/* server name and _meta namespaces; five provider-specific tool names; no platform fingerprint
  tools:
  - name: describe_verify_evidence
    title: Describe Agent Verification Utility
    category: discovery
    read_only: true
    cost: free
    annotations: {readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false}
    input_schema: 'object with no properties'
    description: Describe when deterministic verification is useful, when it is not, free request validation, recipes, limits, and the explicit paid MCP path.
    source_operation: openapi/kgninja-dev-openapi.json#getAgentManifest (closest REST equivalent; composite)
  - name: get_revenue_goal_status
    title: Get Revenue Goal Status
    category: operations
    read_only: true
    cost: free
    annotations: {readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false}
    input_schema: 'object with no properties'
    description: Read the active revenue goal, measured funnel, contribution margin, and the next bounded improvement recommendation. This tool never changes price, spends funds, or sends messages.
    source_operation: openapi/kgninja-dev-openapi.json#getRevenueGoalStatus
  - name: quote_verify_evidence
    title: Quote Verification
    category: purchase
    read_only: false
    cost: free
    annotations: {readOnlyHint: false, destructiveHint: false, idempotentHint: true, openWorldHint: false}
    input_schema:
      idempotency_key: 'string, 16-128 chars, ^[A-Za-z0-9_-]+$ (required)'
      intent: 'object {request {client_request_id, evidence {media_type const application/json, content_base64 maxLength 87384}, assertions[1..16] oneOf sha256_equals | json_pointer_exists | json_pointer_equals | json_type_is}, spend_policy {policy_version const agent-economy/precheck-policy/2.0, max_amount_atomic, network enum [eip155:84532, eip155:8453], asset, pay_to}, precheck_receipt_digest ^sha256:[a-f0-9]{64}$} (required)'
    description: Validate a complete verification request and return a free quote when the margin policy passes.
    source_operation: openapi/kgninja-dev-openapi.json#quoteVerifyEvidence
  - name: prepare_verify_evidence_purchase
    title: Prepare HTTP Purchase
    category: purchase
    read_only: false
    cost: free
    annotations: {readOnlyHint: false, destructiveHint: false, idempotentHint: true, openWorldHint: false}
    input_schema: same shape as quote_verify_evidence (idempotency_key + intent)
    description: After a successful free precheck, create or reuse a bound quote and return the exact HTTP request that will produce the x402 challenge. Do not pay until the binding, price, network, asset, payTo, and expiry match local policy.
    source_operation: openapi/kgninja-dev-openapi.json#quoteVerifyEvidence + #verifyEvidence (composite)
  - name: verify_evidence
    title: Verify Evidence (paid)
    category: purchase
    read_only: false
    cost: 10000 atomic USDC ($0.01) per call via x402
    annotations: {readOnlyHint: false, destructiveHint: false, idempotentHint: true, openWorldHint: true}
    input_schema: same shape as quote_verify_evidence (idempotency_key + intent)
    description: Run deterministic checks and return a paid binding receipt plus Ed25519-signed evidence after x402 payment.
    source_operation: openapi/kgninja-dev-openapi.json#verifyEvidence
