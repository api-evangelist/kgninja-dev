source: >-
  Derived by aligning the LIVE MCP tools/list (mcp/kgninja-dev-mcp-tools.json, 5 tools with inputSchema,
  fetched anonymously 2026-09-19) and the A2A agent card's one skill with the provider's OpenAPI 3.1.0
