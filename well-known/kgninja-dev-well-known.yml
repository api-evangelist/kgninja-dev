  note: >-
    agent-economy.kgninja.dev is the richest /.well-known/ surface this pipeline has recorded on a single
    host: an A2A 1.0 agent card, an RFC 9727 API catalog served with the linkset media type and profile, an
    MCP server card (twice — the Cloudflare Agent Readiness shape at /.well-known/mcp/server-card.json and a
    byte-identical alias at /.well-known/mcp.json), an x402 v2 manifest, an AI Catalog 1.0 document, an
    Agent Skills discovery index (v0.2.0, with a SHA-256 digest that matched the fetched SKILL.md), a JWKS
    (one Ed25519 key), a revenue-goal document, the OpenAPI at a well-known alias, the verification recipes
    at a well-known alias, and an MCP Registry HTTP ownership proof. It also emits a Content-Signal
    directive in robots.txt AND as a response header on every response (ai-train=no, search=yes,
    ai-input=yes). Every miss is the host's real JSON 404 ({"error":{"code":"NOT_FOUND",...}}, 155 bytes),
    and a negative-control path that cannot exist also 404s, so the 200s are served documents and not a
    catch-all. NOT served, and stated as intentional in auth.md: OAuth authorization-server metadata,
    OAuth protected-resource metadata and OIDC discovery ("this is not an OAuth-protected resource").
    NOT served: security.txt (so no SecurityTxt pointer), ai-plugin.json, UCP/ACP, AAuth, APIs.json.
    The registrable domain kgninja.dev and www.kgninja.dev have NO A or AAAA record (NS and MX only), so
    nothing can be fetched from either — recorded as status 0 with dns: no-address rather than as a 404.
