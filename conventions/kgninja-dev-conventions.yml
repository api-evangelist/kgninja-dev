base_url: https://agent-economy.kgninja.dev
media_type: application/json
description: >-
  How the Agent Verification Utility behaves across its operations: an anonymous access model gated by
  payment rather than credentials, a required Idempotency-Key on the quote route (and idempotency_key on
  every MCP purchase tool) with a 409 on divergent reuse, a free precheck that is the contract's dry-run,
  no reversal path once a paid verification settles, a single JSON error envelope with a request id in
  body and header, x402 v2 payment headers, RFC 8288 Link discovery on every response, Accept-negotiated
  Markdown for the docs pages, and 429 + Retry-After rate-limit signalling with unpublished numbers.
auth:
  style: >-
    Anonymous by design. No account, API key, OAuth, OIDC, cookie or session is required for discovery,
    documentation, health, stats, quotes, MCP tools/list or the four free MCP tools. The only
    securityScheme in the contract (agentRegistration, http bearer) protects one read — GET
    /agent/registration — using an optional 15-minute receipt issued by POST /agent/register; it "grants no
    API access and does not authorize payment". Paid execution is authorized per request by an x402 v2
    payment signature (PAYMENT-SIGNATURE header or _meta["x402/payment"]), which "is not a reusable
    application credential ... and does not create an authenticated session".
  detail: authentication/kgninja-dev-authentication.yml
idempotency:
  supported: true
  coverage: partial
  mechanism: Idempotency-Key request header (REST /quote) and idempotency_key argument (MCP purchase tools, A2A DataPart)
  header: Idempotency-Key
  key_format: 16-128 characters matching ^[A-Za-z0-9_-]+$ (a UUID qualifies); required
  scope:
  - quoteVerifyEvidence
  - mcp:quote_verify_evidence
  - mcp:prepare_verify_evidence_purchase
  - mcp:verify_evidence
  - a2a:prepare-json-evidence-verification
  not_covered:
  - verifyEvidence
  - registerAnonymousAgent
  conflict_behavior: >-
    "Stable key for one logical quote request. Reusing it with a different request hash returns 409"
    (components.parameters.IdempotencyKey). The receipts guide: "An idempotency key is bound to a canonical
    request. Retrying the same delivered purchase returns the same transaction instead of creating duplicate
    revenue or cost events. Reusing an idempotency key with different content fails."
  retention: 'Not stated as a duration. Quotes carry expires_at / quote_expires_at (duration unpublished); "Quotes expire, but completed transaction records remain auditable."'
  description: >-
    The mechanism spans the money-bearing surface on MCP and A2A (every purchase tool and the A2A skill
    require the key) and the quote route on REST, but NOT the REST purchase route itself: POST
    /verify-evidence declares no Idempotency-Key parameter. Its replay safety comes from a different
    binding — the request is tied to a bound quote (X-Quote-ID, or the quote the server creates from the
    complete intent) and "a paid retry identifies the generated bound quote from the signed payment
    payload", so a re-sent paid body settles against the same quote rather than a second one. Coverage is
    therefore partial, not full: 4 of the 6 write surfaces carry a documented key, the REST purchase route
    relies on quote binding, and the optional registration POST has no replay protection at all (the
    receipt it issues is harmless by design).
  observed: 'POST /quote with an empty body and no header answered 400 INVALID_IDEMPOTENCY_KEY "Idempotency-Key must contain 16-128 URL-safe characters" before validating anything else.'
dry_run_mode:
  supported: true
  status: documented
  mechanism: dedicated free routes, not a parameter on the destructive operation
  surfaces:
  - operation: validateVerificationRequest
    route: POST /validate-request
    cost: free; no key, no payment
    description: >-
      Quoted from the contract: "performs no external fetch, creates no quote, transaction, or payment,
      executes no assertion, returns no signed evidence, and retains or logs no raw evidence." It returns
      the same canonical offer and an unsigned precheck receipt whose digest the paid intent must carry, so
      the paid call cannot be made without first rehearsing it. Observed live with an empty body: HTTP 400
      with reason_code INVALID_REQUEST_SCHEMA and the canonical offer attached.
  - operation: quoteVerifyEvidence
    route: POST /quote
    cost: free
    description: Economic preflight after the precheck — returns the bound quote, exact price, expiry and the purchase instructions without executing.
  - operation: mcp:describe_verify_evidence, mcp:quote_verify_evidence, mcp:prepare_verify_evidence_purchase
    cost: free
    description: The MCP twins — describe limits, obtain a quote, and obtain the exact HTTP request that will produce the 402, all without paying.
  note: >-
    The paid operation (verifyEvidence / verify_evidence) exposes no dry_run, simulate or preview parameter
    of its own; the x402 manifest states simulation false and mockMode false. The rehearsal is a mandatory
    separate step, which the provider frames as "Do not pay mechanically."
reversibility:
  grade: none
  write_surface: true
  docs: https://agent-economy.kgninja.dev/docs/reproducible-x402-receipts
  note: >-
    A write surface exists — POST /verify-evidence and the MCP tool verify_evidence spend real USDC — and no
    reversal operation exists for it: the contract has no refund, cancel, void or reverse operation, and
    the receipt's own recourse block says so in schema (recourse.re_evaluation_supported true,
    recourse.re_evaluation_requires_new_payment true, recourse.supersession_supported false,
    receipt_retrieval and evidence_retrieval null). The provider's stated recourse is to run the check again
    for a new payment. No window is stated anywhere because there is nothing to exercise inside one. Grade
    is none, not na: the hazard is real ($0.01 per call, settled on-chain) and the absence is the finding.
  write_surfaces:
  - operation: verifyEvidence
    also: mcp:verify_evidence
    action: Settle an x402 payment (10000 atomic USDC on Base) and execute deterministic checks
    reversal: none
    reversal_operation: null
    window: null
    grade: none
    stated_terms:
    - source: openapi VerificationReceiptPayload.recourse
      verbatim: 're_evaluation_supported: const true; re_evaluation_requires_new_payment: const true; supersession_supported: const false; receipt_retrieval: null; evidence_retrieval: null'
    - source: https://agent-economy.kgninja.dev/docs/reproducible-x402-receipts
      verbatim: 'Retrying the same delivered purchase returns the same transaction instead of creating duplicate revenue or cost events.'
    - source: https://agent-economy.kgninja.dev/docs/security-and-trust
      verbatim: 'The service does not ... custody user funds, or authorize payments on the caller''s behalf. Payment approval remains the calling agent''s policy decision.'
    note: The provider's safety model is entirely pre-commit (precheck, bound quote, explicit payment approval, expiry, maxTimeoutSeconds 300); post-commit there is no undo.
  - operation: quoteVerifyEvidence
    also: mcp:quote_verify_evidence, mcp:prepare_verify_evidence_purchase, a2a:prepare-json-evidence-verification
    action: Create or reuse a bound quote (a D1 write, free)
    reversal: none needed — quotes expire on their own (expires_at; duration unpublished) and cost nothing
    grade: na
  - operation: registerAnonymousAgent
    action: Issue a 15-minute anonymous registration receipt
    reversal: none — "There is no revocation endpoint because the receipt has no application privileges and expires after 15 minutes; discard it to stop using it." (auth.md)
    window: 15 minutes (expiry, not a reversal window)
    grade: na
    note: Nothing to reverse; the credential carries no privilege.
payment:
  protocol: x402 v2, scheme exact
  price: 10000 atomic USDC ($0.01) per verify_evidence / POST /verify-evidence
  network: eip155:8453 (Base); eip155:84532 (Base Sepolia) appears in schema enums but the served terms name 8453 only
  asset: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913 (USDC, 6 decimals)'
  pay_to: '0x4D7d842536De9Eb491AE2300126B3CDdE7B0aDE3'
  max_timeout_seconds: 300
  rest_headers:
    challenge: 'HTTP 402 with PAYMENT-REQUIRED response header and an X402PaymentRequired JSON body (x402Version 2, accepts[], extensions incl. bazaar, paid_verification_binding)'
    payment: 'PAYMENT-SIGNATURE request header — "Base64-encoded x402 v2 payment payload, supplied on the paid retry"'
    settlement_proof: 'PAYMENT-RESPONSE response header on the 200'
    quote_binding: 'X-Quote-ID request header (optional; the signed payload identifies the bound quote when omitted)'
  mcp_meta_keys: ['x402/error (challenge, in a tool error)', 'x402/payment (retry)', 'x402/payment-response (settlement proof)']
  precheck_binding: The paid intent must carry precheck_receipt_digest from POST /validate-request; the paid route recomputes the receipt and refuses stale or incompatible discovery with 409 before creating a quote.
