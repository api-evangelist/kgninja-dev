summary: >-
  KG-NINJA documents the rate-limit SIGNAL but publishes no numbers. The contract declares a reusable 429
  RateLimited response ("Rate limit exceeded") with a Retry-After header (integer seconds, minimum 1) on
  the registration, quote, purchase, health, manifest, OpenAPI and MCP operations, and exposes Retry-After
  via CORS on every response. The security-and-trust page states that "Quote, MCP, and purchase paths have
  separate rate-limit bindings" and that "MCP hostnames are allowlisted for production"; auth.md states that
  the optional registration receipt "cannot bypass rate limits". No window, ceiling or burst figure is
  published anywhere found, no X-RateLimit-*/RateLimit-* headers are declared, and none were observed on
  the ~60 unauthenticated responses this pass received (all 2xx/4xx, no 429). limit_count is therefore 0:
  an honest zero for the numbers, with the exhaustion behaviour recorded below because that is what an
  agent can act on.
